name: VT-063 reviewer harness checks
on:
  pull_request:
    paths:
      - "vt063/**"
      - ".github/workflows/vt063-tests.yml"
  push:
    branches:
      - "bt3-23001849-vt063-reviewer-harness"
jobs:
  characterize:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install coverage
        run: python -m pip install coverage==7.10.7
      - name: Run 19 unit tests and branch coverage
        run: |
          PYTHONPATH=vt063 python -m coverage run --branch --source=approval_harness -m unittest discover -s vt063/tests -v
          PYTHONPATH=vt063 python -m coverage report -m
      - name: Mutation should be detected
        run: PYTHONPATH=vt063 python vt063/mutation_check.py
      - name: Local 150-thread experiment (not SLA)
        run: PYTHONPATH=vt063 python vt063/load_150.py
