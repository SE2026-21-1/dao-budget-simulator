name: TV4 manual application deployment

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA from a successful Dev release
        required: true
        type: string
      mode:
        description: Verify only never connects to a server
        required: true
        default: verify
        type: choice
        options: [verify, deploy]

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: dao-staging-deployment
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.15.0'
      - name: Resolve successful trusted release and verify complete manifest
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          mkdir verified
          node scripts/cd/release.mjs download --sha "$RELEASE_SHA" --manifest verified/manifest.json
          node scripts/cd/release.mjs verify --sha "$RELEASE_SHA" --manifest verified/manifest.json
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
          path: release-source
          persist-credentials: false
      - name: Verify release source schema and Compose syntax
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          node scripts/cd/release.mjs verify-local --sha "$RELEASE_SHA" --manifest verified/manifest.json --migrations release-source/database/migrations
          docker compose -f release-source/deploy/compose.yml config --no-interpolate --quiet
      - name: Verify all published images can be pulled before any SSH
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          while IFS='=' read -r name image; do docker pull "$image"; done < verified/release.env
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-release
          path: verified/
          if-no-files-found: error
          retention-days: 7
      - name: Report verification boundary
        run: |
          echo 'SHA, successful Dev push CI, manifest provenance and all three GHCR pulls verified. No SSH or server changes in verify mode. Server-managed secrets, metadata, schema, network and smoke checks require server preflight during deploy.' >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: docker logout ghcr.io

  deploy:
    needs: verify
    if: inputs.mode == 'deploy' && github.ref == 'refs/heads/Dev'
    environment: dao-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: verified-release
          path: verified
      - name: Validate explicit server configuration
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          PORT: ${{ vars.DEPLOY_PORT }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]] && ((PORT > 0 && PORT < 65536))
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
      - name: Transfer verified release bundle and invoke controlled deployment
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          PORT: ${{ vars.DEPLOY_PORT }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          remote="/srv/dao/releases/$RELEASE_SHA"
          opts=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15)
          tar -czf bundle.tgz deploy scripts/cd/release.mjs -C verified manifest.json release.env
          ssh "${opts[@]}" -p "$PORT" "$USER@$HOST" "umask 077; mkdir -p '$remote'"
          scp "${opts[@]}" -P "$PORT" bundle.tgz "$USER@$HOST:$remote/bundle.tgz"
          ssh "${opts[@]}" -p "$PORT" "$USER@$HOST" "set -eu; cd '$remote'; tar -xzf bundle.tgz; bash deploy/deploy.sh deploy '$remote' '$RELEASE_SHA'"
      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts" bundle.tgz
